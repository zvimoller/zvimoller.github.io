<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // SPA redirect for GitHub Pages
      // Redirect /some/path -> /?p=/some/path (then index.html restores it)
      var l = window.location;
      var p = l.pathname + l.search + l.hash;
      l.replace((l.origin + "/?p=" + encodeURIComponent(p)));
    </script>
  </head>
  <body></body>
</html>
